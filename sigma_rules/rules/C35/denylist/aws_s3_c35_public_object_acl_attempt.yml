title: AWS S3 C35 - Public Object ACL Attempt
id: 8b491de0-6660-4f84-9c89-54c98749a672
status: test
description: Monitor ObjectACL changes (or tentative changes) to public using CloudTrail S3 data events.
testing: Make a call to create a public ObjectACL; it should be detected.
notes: |
    Denylist mode references `%denied_object_acls_c35%` and `%denied_object_acl_grantees_c35%` — customers extend these lists with org-specific banned values beyond the universal mode's hardcoded `AllUsers` / public-* patterns.
references:
    - https://docs.aws.amazon.com/AmazonS3/latest/API/API_PutObjectAcl.html
    - https://docs.aws.amazon.com/AmazonS3/latest/API/API_PutObject.html
    - https://docs.aws.amazon.com/AmazonS3/latest/API/API_CreateMultipartUpload.html
    - https://docs.aws.amazon.com/awscloudtrail/latest/userguide/cloudtrail-event-reference-record-contents.html
author: TrustOnCloud
date: 2026-02-15
modified: 2026-03-25
tags:
    - trustoncloud.aws.s3
    - trustoncloud.control.s3.c35
logsource:
    product: aws
    service: cloudtrail
detection:
    selection_event:
        eventSource: s3.amazonaws.com
        eventCategory: Data
        eventName:
            - PutObjectAcl
            - PutObject
            - CopyObject
            - CreateMultipartUpload
    selection_deny_acl:
        requestParameters.x-amz-acl|contains|expand: '%denied_object_acls_c35%'
    selection_deny_grant_read:
        requestParameters.x-amz-grant-read|contains|expand: '%denied_object_acl_grantees_c35%'
    selection_deny_grant_full_control:
        requestParameters.x-amz-grant-full-control|contains|expand: '%denied_object_acl_grantees_c35%'
    selection_deny_grant_read_acp:
        requestParameters.x-amz-grant-read-acp|contains|expand: '%denied_object_acl_grantees_c35%'
    selection_deny_grant_write_acp:
        requestParameters.x-amz-grant-write-acp|contains|expand: '%denied_object_acl_grantees_c35%'
    condition: selection_event and (selection_deny_acl or 1 of selection_deny_grant_*)
falsepositives:
    - Approved ACL workflows that intentionally include listed ACL values or grantees.
level: low
