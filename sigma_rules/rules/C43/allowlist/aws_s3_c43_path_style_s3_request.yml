title: AWS S3 C43 - Path-Style S3 Request
id: 67683cd2-fb86-4fb6-83f5-ed4c142981f1
status: test
description: Monitor that all S3 connections are made with the virtual-hosted model (e.g., via CloudTrail S3 requestParameters.Host).
testing: Make a path-style request to S3; it should be detected.
notes: |
    Fires on path-style requests unless the bucket AND region are both authorized (`%authorized_path_style_buckets_c43%`, `%authorized_path_style_regions_c43%`) — if either is unauthorized, it fires. AWS service principals (`userIdentity.type: AWSService`) are always suppressed — internal services issue path-style calls for compatibility and aren't the target.
references:
    - https://docs.aws.amazon.com/AmazonS3/latest/userguide/VirtualHosting.html
    - https://docs.aws.amazon.com/AmazonS3/latest/userguide/cloudtrail-logging-s3-info.html
    - https://docs.aws.amazon.com/awscloudtrail/latest/userguide/cloudtrail-event-reference-record-contents.html
author: TrustOnCloud
date: 2026-02-15
modified: 2026-04-26
tags:
    - trustoncloud.aws.s3
    - trustoncloud.control.s3.c43
logsource:
    product: aws
    service: cloudtrail
detection:
    selection_event:
        eventSource: s3.amazonaws.com
        eventCategory: Data
        resources.type|contains: AWS::S3::Object
    selection_path_style_host_upper_starts:
        requestParameters.Host|startswith:
            - 's3.'
            - 's3-'
    selection_path_style_host_upper_ends:
        requestParameters.Host|endswith: '.amazonaws.com'
    selection_path_style_host_lower_starts:
        requestParameters.host|startswith:
            - 's3.'
            - 's3-'
    selection_path_style_host_lower_ends:
        requestParameters.host|endswith: '.amazonaws.com'
    filter_authorized_bucket:
        requestParameters.bucketName|expand: '%authorized_path_style_buckets_c43%'
    filter_authorized_region:
        awsRegion|expand: '%authorized_path_style_regions_c43%'
    filter_aws_service:
        userIdentity.type: AWSService
    condition: selection_event and ((selection_path_style_host_upper_starts and selection_path_style_host_upper_ends) or (selection_path_style_host_lower_starts and selection_path_style_host_lower_ends)) and not (filter_authorized_bucket and filter_authorized_region) and not filter_aws_service
falsepositives:
    - Legacy clients intentionally using path-style requests to authorized resources not yet allowlisted.
level: informational
