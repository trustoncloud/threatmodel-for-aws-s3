title: AWS S3 C85 - Request Without Authorization Header
id: 35d54299-8cd9-4d66-aeb9-2980ae381167
status: test
description: Monitor and investigate all requests that do not use the HTTP authorization header (e.g., via CloudTrail S3 events where the additionalEventData.AuthenticationMethod is different from "AuthHeader").
testing: Make 1) a presigned AWS API call and 2) a POST request without the HTTP authorization header; it should be detected.
notes: |
    Denylist mode fires only when the AuthenticationMethod value is in `%denied_auth_methods_c85%` (defaults to QueryString, POST, Anonymous). Use this mode to scope alerts to a specific set of bad methods rather than the universal "anything but AuthHeader" check.
references:
    - https://docs.aws.amazon.com/AmazonS3/latest/userguide/cloudtrail-logging-understanding-s3-entries.html
    - https://docs.aws.amazon.com/prescriptive-guidance/latest/presigned-url-best-practices/identifying-requests.html
    - https://docs.aws.amazon.com/awscloudtrail/latest/userguide/cloudtrail-event-reference-record-contents.html
author: TrustOnCloud
date: 2026-02-15
modified: 2026-03-24
tags:
    - trustoncloud.aws.s3
    - trustoncloud.control.s3.c85
logsource:
    product: aws
    service: cloudtrail
detection:
    selection:
        eventSource: s3.amazonaws.com
        eventCategory: Data
        additionalEventData.AuthenticationMethod|exists: true
    selection_deny_auth_method:
        additionalEventData.AuthenticationMethod|expand: '%denied_auth_methods_c85%'
    condition: selection and selection_deny_auth_method
falsepositives:
    - Approved workflows that intentionally use listed authentication methods.
level: low
